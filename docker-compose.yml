services:
  migrate:
    build: .
    command: python manage.py migrate --noinput
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Coolify injects restart:unless-stopped onto every service by default
    # unless overridden here. migrate is a one-shot job (exits 0 on success)
    # — left to Coolify's default, it restarts forever after every successful
    # exit, and that container-ID churn is what broke app/worker's
    # depends_on: condition: service_completed_successfully (confirmed live:
    # migrate was cycling exit-0 -> restart, deploy log showed "No such
    # container" when compose polled a migrate container ID that had already
    # been replaced by the next restart).
    restart: "no"

  app:
    build: .
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: python manage.py process_tasks
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No published port: app/worker/migrate reach this over the internal
    # Docker network by service name ("postgres"), nothing outside the
    # compose stack needs to. Publishing 5432 to the host would put a
    # database on the public IP behind whatever POSTGRES_PASSWORD is set to.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
